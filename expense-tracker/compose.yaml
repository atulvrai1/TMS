services:
  fleetflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetflow:local
    container_name: fleetflow
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    environment:
      APP_ENV: ${APP_ENV:-development}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env.docker}
      FLEETFLOW_PUBLIC_URL: ${FLEETFLOW_PUBLIC_URL:-http://127.0.0.1:5001}
      DATABASE_PATH: /data/tms.db
      FLASK_HOST: 0.0.0.0
      PORT: 5001
      # Optional Gemini credentials/model for natural-language LLM responses.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      FLEETFLOW_AI_MODEL: ${FLEETFLOW_AI_MODEL:-gemini-2.5-flash}
      # Optional LangSmith observability for LangGraph runs (disabled by default).
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-fleetflow-assistant}
      # Configure SMTP only when you want password-reset emails.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Msg07 API credentials stay in the private .env.docker file.
      MSG07_API_URL: ${MSG07_API_URL:-}
      MSG07_API_KEY: ${MSG07_API_KEY:-}
      MSG07_AUTH_HEADER: ${MSG07_AUTH_HEADER:-Authorization}
      MSG07_AUTH_SCHEME: ${MSG07_AUTH_SCHEME-Bearer}
      MSG07_PAYLOAD_TEMPLATE: ${MSG07_PAYLOAD_TEMPLATE:-}
      MSG07_MESSAGE_TEMPLATE: ${MSG07_MESSAGE_TEMPLATE:-}
    volumes:
      - fleetflow_data:/data
      - fleetflow_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    init: true

  compliance-sms-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetflow:local
    container_name: fleetflow-compliance-sms-worker
    restart: unless-stopped
    command: ["python", "controller/compliance_sms_worker.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env.docker}
      DATABASE_PATH: /data/tms.db
      FLEETFLOW_PUBLIC_URL: ${FLEETFLOW_PUBLIC_URL:-http://127.0.0.1:5001}
      MSG07_API_URL: ${MSG07_API_URL:-}
      MSG07_API_KEY: ${MSG07_API_KEY:-}
      MSG07_AUTH_HEADER: ${MSG07_AUTH_HEADER:-Authorization}
      MSG07_AUTH_SCHEME: ${MSG07_AUTH_SCHEME-Bearer}
      MSG07_PAYLOAD_TEMPLATE: ${MSG07_PAYLOAD_TEMPLATE:-}
      MSG07_MESSAGE_TEMPLATE: ${MSG07_MESSAGE_TEMPLATE:-}
      COMPLIANCE_SMS_CHECK_INTERVAL_SECONDS: ${COMPLIANCE_SMS_CHECK_INTERVAL_SECONDS:-86400}
    volumes:
      - fleetflow_data:/data
    depends_on:
      - fleetflow
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  fleetflow_data:
  fleetflow_uploads:
