{% extends "base.html" %}

{% block title %}Sign in — FleetFlow{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your FleetFlow account</p>
        </div>

        <div class="auth-card">
            <div class="login-tabs" role="tablist" aria-label="Choose account type">
                <a href="{{ url_for('login', role='user') }}"
                   class="login-tab{% if login_role != 'admin' %} active{% endif %}"
                   role="tab" aria-selected="{{ 'true' if login_role != 'admin' else 'false' }}">User Login</a>
                <a href="{{ url_for('login', role='admin') }}"
                   class="login-tab{% if login_role == 'admin' %} active{% endif %}"
                   role="tab" aria-selected="{{ 'true' if login_role == 'admin' else 'false' }}">Admin Login</a>
            </div>
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="login_role" value="{{ login_role }}">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="email@example.com"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="Your password"
                           required>
                </div>
                <p class="auth-switch" style="text-align: right; margin: -0.5rem 0 1rem;">
                    <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
                </p>
                <button type="submit" class="btn-submit">Sign in</button>
            </form>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one free</a>
        </p>

    </div>
</section>

{% endblock %}
