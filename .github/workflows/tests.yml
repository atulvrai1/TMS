name: TMS checks

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main, "fix/**"]

jobs:
  security-smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: expense-tracker/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
