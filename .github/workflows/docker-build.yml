name: Docker image build

on:
  pull_request:
    paths:
      - "expense-tracker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "expense-tracker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./expense-tracker
          file: ./expense-tracker/Dockerfile
          push: false
          tags: fleetflow:ci
          load: true

      - name: Start container
        run: |
          docker run --detach --name fleetflow-smoke \
            --publish 5001:5001 \
            --env APP_ENV=production \
            --env FLASK_SECRET_KEY=ci-only-secret-key-0123456789abcdef0123456789 \
            --env FLASK_HOST=0.0.0.0 \
            --env PORT=5001 \
            --env DATABASE_PATH=/data/tms.db \
            fleetflow:ci

      - name: Wait for HTTP response
        run: |
          for attempt in $(seq 1 30); do
            if docker exec fleetflow-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=3)"; then
              echo "FleetFlow returned an HTTP response."
              exit 0
            fi
            sleep 2
          done
          docker logs fleetflow-smoke
          exit 1

      - name: Show logs if the job fails
        if: failure()
        run: docker logs fleetflow-smoke || true

      - name: Clean up
        if: always()
        run: docker rm --force fleetflow-smoke || true
